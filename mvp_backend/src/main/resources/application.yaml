spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: your_username
    password: your_password
    hikari:
      maximum-pool-size: 10

  jackson:
    serialization:
      write-bigdecimal-as-plain: true

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 10
          max-wait: 2000ms
        timeout: 1000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: cai_shen
    password: 123456
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 10
        max-concurrency: 20
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-interval: 10000ms
        multiplier: 2

  #  servlet 必须在 spring 节点下
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

#  redisson 是独立的顶级节点，与 spring 平级
redisson:
  single-server-config:
    address: redis://${spring.data.redis.host}:${spring.data.redis.port}
    connection-pool-size: 32
    connection-min-idle-size: 16
    idle-connection-timeout: 10000
    connect-timeout: 10000
    timeout: 3000
    retry-attempts: 3
    retry-interval: 1500
  validation:
    enable: true

server:
  port: 8080
