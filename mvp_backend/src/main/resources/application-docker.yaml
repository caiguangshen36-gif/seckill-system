# Docker 环境配置
# 所有 host 使用 docker-compose 中的服务名

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:159357}

  data:
    redis:
      host: redis
      port: 6379

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}

  # 覆盖 redis host，保证 RedissonConfig 的 @Value("${spring.redis.host}") 能读到
  redis:
    host: redis
    port: 6379
